<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viewfinder Canvas</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #171717;
        }
        canvas {
            border: 1px solid white;
            background-color: #171717;
        }
    </style>
</head>
<body>
    <canvas id="canvas" width="1200" height="800"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        function setupCanvas() {
            const dpr = window.devicePixelRatio || 1;
            const displayWidth = 1200;
            const displayHeight = 800;

            canvas.width = displayWidth * dpr;
            canvas.height = displayHeight * dpr;

            canvas.style.width = displayWidth + 'px';
            canvas.style.height = displayHeight + 'px';

            ctx.scale(dpr, dpr);
        }

        setupCanvas();

        async function loadAndRenderShapes() {
            try {
                const response = await fetch('/api/db');
                const data = await response.json();

                ctx.clearRect(0, 0, canvas.width, canvas.height);

                data.clients.forEach(client => {
                    const { x,y,width,height } = client.location;

                    ctx.strokeStyle = 'white';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(x, y, width, height);

                    ctx.fillStyle = 'white';
                    ctx.font = '16px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(client.id, x + width / 2, y + height / 2);
                });

                data.shapes.forEach(shape => {
                    ctx.fillStyle = shape.color;

                    if (shape.strokeWidth) {
                        ctx.lineWidth = shape.strokeWidth;
                        ctx.strokeStyle = 'white';
                    }

                    if (shape.type === 'circle') {
                        ctx.beginPath();
                        ctx.arc(shape.x, shape.y, shape.radius, 0, Math.PI * 2);
                        ctx.fill();
                        if (shape.strokeWidth) ctx.stroke();
                    } else if (shape.type === 'rectangle') {
                        ctx.fillRect(shape.x, shape.y, shape.width, shape.height);
                        if (shape.strokeWidth) {
                            ctx.strokeRect(shape.x, shape.y, shape.width, shape.height);
                        }
                    }
                });
            } catch (error) {
                console.error('Failed to load shapes:', error);
            }
        }

        loadAndRenderShapes();

        let ws;

        function connectWebSocket() {
            ws = new WebSocket('ws://localhost:3000/ws?client=web');

            ws.onopen = function() {
                console.log('WebSocket connected');
            };

            ws.onmessage = function(event) {
                console.log(event);
                if (event.data === 'reload') {
                    console.log("reloading")
                    loadAndRenderShapes();
                } else if (event.data === 'reload-page') {
                    console.log("reloading page")
                    window.location.reload();
                }
            };

            ws.onclose = function(event) {
                console.log('WebSocket disconnected, reconnecting in 1 second...');
                setTimeout(connectWebSocket, 1000);
            };

            ws.onerror = function(error) {
                console.error('WebSocket error:', error);
            };
        }

        connectWebSocket();

        window.addEventListener('focus', loadAndRenderShapes);
    </script>
</body>
</html>
